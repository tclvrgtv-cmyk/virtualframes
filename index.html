<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Virtual Frames">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Bangers&family=Sacramento&family=Playfair+Display:wght@700&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600;700;800&family=Oxanium:wght@400;500;600&family=Creepster&family=Rubik+Distressed&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --card:#111113;
    --card2:#17171a;
    --glass: rgba(255,255,255,0.06);
    --glass-brd: rgba(255,255,255,0.10);
    --text:#f5f5f7;
    --text-dim: rgba(245,245,247,0.55);
    --accent:#F4C61B;
    --accent2:#B8102E;
    --spring: cubic-bezier(.32,.72,0,1);
    --sat: env(safe-area-inset-top);
    --sab: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{height:100%;}
  body{
    margin:0; background:#000; color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
    overflow:hidden; position:fixed; inset:0;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  svg{ display:block; }
  button{ font-family:inherit; }

  /* ---------- root content (scales down when sheet presented) ---------- */
  #rootContent{
    height:100%; display:flex; flex-direction:column;
    transition: transform .48s var(--spring), border-radius .4s var(--spring), filter .4s;
    transform-origin: top center;
    background:#000;
  }
  #rootContent.pushed{ transform: scale(0.92) translateY(6px); border-radius:28px; overflow:hidden; filter:brightness(0.62); }

  /* ---------- nav bar ---------- */
  .navbar{
    padding: calc(10px + var(--sat)) 20px 12px;
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    backdrop-filter: blur(24px) saturate(1.4);
    background: rgba(0,0,0,0.55);
    flex-shrink:0; position:relative; z-index:5;
  }
  .navbar-row{ display:flex; align-items:center; justify-content:center; position:relative; height:22px; }
  /* home-only wordmark: rebuilt in the VirtualGate style, different word */
  .home-wordmark{
    display:inline-flex; align-items:center; gap:9px;
    padding:2px 0; line-height:1;
  }
  .home-wordmark span{
    font-family:'Oxanium',-apple-system,sans-serif;
    font-weight:500; font-size:16px; letter-spacing:2.6px; color:#fff;
  }
  .wm-star{ height:23px; width:auto; display:block; }
  .large-title{ font-size:34px; font-weight:800; letter-spacing:-0.6px; margin: 2px 0 4px; }

  /* ---------- home ---------- */
  .home{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; padding: 4px 20px calc(30px + var(--sab)); }
  .home::-webkit-scrollbar{ display:none; }
  .home-sub{ color:var(--text-dim); font-size:14.5px; line-height:1.4; margin: 0 0 22px; max-width:34ch; }

  /* inset grouped list (iOS table view) */
  .list{ background: var(--card); border-radius:22px; overflow:hidden; border:1px solid var(--glass-brd); }
  .advcard{
    position:relative; cursor:pointer; touch-action:manipulation;
    background: transparent; padding:20px 18px;
    display:flex; align-items:center; gap:17px; min-height:98px;
    transition: background .18s;
    -webkit-user-drag:none;
  }
  .advcard + .advcard::before{
    content:''; position:absolute; top:0; left:93px; right:0; height:1px; background:rgba(255,255,255,0.08);
  }
  .advcard:active{ background: rgba(255,255,255,0.07); }
  .advcard:active::before, .advcard:active + .advcard::before{ opacity:0; }
  .advcard .row-text{ flex:1; min-width:0; }
  .group-head .chev{ transition: transform .32s var(--spring); }
  .group-head.open .chev{ transform: rotate(90deg); }
  .subgroup{ max-height:0; overflow:hidden; transition: max-height .38s var(--spring); background:rgba(255,255,255,0.03); }
  .advcard.subrow{ padding-left:34px; min-height:86px; }
  .advcard.subrow .icon-tile{ width:48px; height:48px; border-radius:13px; }
  .advcard.subrow .icon-tile svg{ width:25px; height:25px; }
  .advcard.subrow .name{ font-size:17px; }
  .advcard.subrow + .advcard.subrow::before{ left:98px; }
  .advcard .chev{ width:21px; height:21px; color:rgba(235,235,245,0.32); flex-shrink:0; }
  .icon-tile{
    width:58px; height:58px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 6px 16px -5px var(--c2);
    color:#fff; flex-shrink:0;
  }
  .icon-tile svg{ width:29px; height:29px; }
  .advcard .name{ font-weight:600; font-size:18.5px; line-height:1.22; letter-spacing:-.3px; }
  .advcard .tag{ font-size:13.5px; color:var(--text-dim); margin-top:3px; }

  /* ---------- sheet ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.001); pointer-events:none; z-index:10;
    transition: background .4s var(--spring);
  }
  .backdrop.show{ background:rgba(0,0,0,0.55); pointer-events:auto; }

  /* full-page screens: this is an internal tool, so depth effects
     matter less than having the whole screen to work with */
  .sheet{
    position:fixed; inset:0; z-index:11;
    background:#0d0d0f; display:flex; flex-direction:column;
    transform: translateX(100%);
    transition: transform .38s var(--spring);
    visibility:hidden;
  }
  .sheet.open{ transform: translateX(0); visibility:visible; }
  /* leaving: the page eases down and back rather than just sliding off */
  .sheet.closing{
    transform: translateY(6%) scale(0.94);
    opacity:0; visibility:visible;
    transition: transform .34s cubic-bezier(.4,0,1,1), opacity .30s ease-in;
  }
  #rootContent{ transition: transform .42s var(--spring), opacity .42s ease; }
  #rootContent.returning{ animation: homeBack .46s var(--spring); }
  @keyframes homeBack{
    from{ transform: scale(1.04); opacity:.4; }
    to  { transform: scale(1);    opacity:1; }
  }
  .advcard.launching{ animation: cardPulse .42s var(--spring); }
  @keyframes cardPulse{
    0%{ background: rgba(255,255,255,0.10); }
    100%{ background: transparent; }
  }
  .grabber{ display:none; }

  .sheet-header{ display:flex; align-items:center; justify-content:space-between;
    padding: calc(8px + var(--sat)) 8px 12px; flex-shrink:0;
    border-bottom:1px solid rgba(255,255,255,0.07); background:#0d0d0f; }
  .sheet-navbtn{
    background:none; border:none; color: var(--tint, var(--accent)); font-size:16px; font-weight:600; padding:8px 10px;
    display:flex; align-items:center; gap:3px; cursor:pointer; touch-action:manipulation; min-height:44px;
  }
  .sheet-navbtn svg{ width:20px; height:20px; }
  .sheet-navbtn:active{ opacity:.5; }
  .sheet-title{ font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw; }
  .navbtn-spacer{ width:64px; }

  .sheet-stage{ flex:1; overflow:hidden; position:relative; min-height:0; }
  .sheet-track{ display:flex; width:300%; height:100%; transition: transform .5s var(--spring); }
  .sheet-page{ width:33.3334%; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; padding: 14px 22px 20px; }
  .sheet-page::-webkit-scrollbar{ display:none; }

  .sheet-footer{ padding: 12px 20px calc(14px + var(--sab)); flex-shrink:0; background:#0d0d0f; border-top:1px solid rgba(255,255,255,0.05); }

  h2.page-title{ font-size:21px; font-weight:800; margin:2px 0 12px; letter-spacing:-.2px; text-align:center; }
  p.page-sub{ color:var(--text-dim); font-size:13.5px; margin:0 0 16px; line-height:1.4; }

  /* ---------- buttons ---------- */
  .btn{
    width:100%; border:none; border-radius:100px; padding:16px 20px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; touch-action:manipulation;
    transition: transform .15s var(--spring), opacity .2s; color:#0c0c0c; background:var(--tint, var(--accent));
    min-height:52px;
  }
  .btn:active{ transform:scale(.96); }
  .btn.ghost{ background:var(--glass); color:var(--text); border:1px solid var(--glass-brd); }
  .btn[disabled]{ opacity:.32; pointer-events:none; }
  .btn.small{ padding:12px 18px; font-size:14px; }
  .row2{ display:flex; gap:10px; }
  .row2 .btn{ flex:1; }

  /* ---------- solved / unsolved choice (Crime Room) ---------- */
  .solved-wrap{ display:none; flex-direction:column; align-items:center; margin: 18px 0 22px; }
  .solved-wrap.show{ display:flex; }
  .solved-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.1px;
    color:var(--text-dim); font-weight:700; margin-bottom:14px; }
  .solved-opts{ display:flex; flex-direction:column; gap:12px; width:100%; }
  .solved-btn{
    width:100%; min-height:64px; border-radius:16px; font-family:inherit;
    font-size:19px; font-weight:800; letter-spacing:2px; cursor:pointer;
    background:transparent; transition: all .22s var(--spring); touch-action:manipulation;
    border:2.5px dashed rgba(255,255,255,0.22); color:rgba(255,255,255,0.45);
  }
  .solved-btn:active{ transform:scale(.97); }
  .solved-btn.yes.on{ border-color:#2FAE52; color:#63D982; background:rgba(47,174,82,0.12); border-style:solid; }
  .solved-btn.no.on{  border-color:#CE2029; color:#FF6B72; background:rgba(206,32,41,0.12); border-style:solid; }

  /* ---------- percentage ring ---------- */
  .pct-wrap{ display:flex; flex-direction:column; align-items:center; margin: 30px 0 16px; position:relative; z-index:2; }
  .pct-ring{ position:relative; width:min(52vw, 196px); aspect-ratio:1; touch-action:none; margin: 0 auto; overflow:visible; z-index:3; }
  .pct-knob{ transition: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
  #pctArc{ stroke: var(--tint, var(--accent)); }
  #pctKnobDot{ fill: var(--tint, var(--accent)); }
  .pct-ring.grabbing .pct-knob-outer{ r: 22; }
  .pct-hint{ font-size:11px; color:var(--text-dim); margin-top:10px; text-align:center; letter-spacing:.2px; }
  .pct-ring svg.ring-svg{ width:100%; height:100%; transform:rotate(135deg); }
  .pct-num{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .pct-num .n{ font-size:40px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
  .pct-num .l{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.2px; margin-top:2px;}

  /* themed text field */
  .field-wrap{ margin: 2px 0 6px; position:relative; z-index:1; }
  .field-label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text-dim); font-weight:700; margin:0 0 8px; text-align:center; }
  .field{
    width:100%; text-align:center; background:#1b1b1f; border:1.5px solid var(--glass-brd); border-radius:14px;
    padding:15px 16px; font-size:17px; font-weight:600; color:var(--text); font-family:inherit;
    outline:none; min-height:52px; -webkit-appearance:none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field::placeholder{ color:rgba(245,245,247,0.28); font-weight:500; }
  .field:focus{ border-color: var(--tint, var(--accent)); }

  .card{ background:#1b1b1f; border:1px solid var(--glass-brd); border-radius:20px; padding:16px 12px 14px; }
  .card-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text-dim); font-weight:700; margin-bottom:10px; text-align:center; }

  /* ---------- time wheels ---------- */
  .wheels{ display:flex; align-items:center; justify-content:center; height:224px; position:relative; }
  .wheels::before, .wheels::after{ content:''; position:absolute; left:0; right:0; height:84px; pointer-events:none; z-index:2; }
  .wheels::before{ top:0; background:linear-gradient(to bottom, #1b1b1f 14%, rgba(27,27,31,0.72) 58%, rgba(27,27,31,0)); }
  .wheels::after{ bottom:0; background:linear-gradient(to top, #1b1b1f 14%, rgba(27,27,31,0.72) 58%, rgba(27,27,31,0)); }
  .wheel{ height:224px; width:190px; overflow-y:scroll; scroll-snap-type:y mandatory; -ms-overflow-style:none; scrollbar-width:none;
    -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; touch-action:pan-y; }
  .wheel::-webkit-scrollbar{ display:none; }
  .wheel-pad{ height:84px; }
  .wheel-item{ height:56px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:600;
    color:rgba(245,245,247,0.34); scroll-snap-align:center; font-variant-numeric:tabular-nums;
    transition:color .18s, font-size .18s, font-weight .18s; touch-action:manipulation; cursor:pointer; }
  .wheel-item.near{ color:rgba(245,245,247,0.60); }
  .wheel-item.mid{ color:var(--text); font-size:44px; font-weight:700; }
  .wheel-col{ position:relative; display:flex; flex-direction:column; align-items:center; z-index:1; }
  .wheel-highlight{ position:absolute; top:84px; height:56px; left:50%; transform:translateX(-50%); width:200px;
    background:rgba(255,255,255,0.07); border-radius:14px; pointer-events:none; z-index:0; }
  .wheel-unit{ margin-top:10px; text-align:center; font-size:13px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:1.4px; font-weight:700; }

  /* ---------- photo ---------- */
  .photo-drop{
    border:1.5px dashed var(--glass-brd); border-radius:24px; aspect-ratio:1080/1350; max-height:68vh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:var(--glass); cursor:pointer; overflow:hidden; position:relative; margin:2px auto 18px; touch-action:manipulation;
  }
  .photo-drop img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; pointer-events:none; }
  .photo-drop .hint{ color:var(--text-dim); font-size:15px; text-align:center; padding:0 30px; }
  .photo-drop .picon{ width:52px; height:52px; color:var(--text-dim); }
  .photo-drop .chg{ position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,.6); backdrop-filter:blur(10px); padding:7px 12px; border-radius:100px; font-size:12px; font-weight:700; }

  /* ---------- result ---------- */
  /* flat preview of the actual generated image — no phone bezel, no notch */
  .phone-mock{ margin: 0 auto; width: min(96vw, 460px); height:auto; max-height:100%; aspect-ratio:1080/1350; border-radius:14px; overflow:hidden; box-shadow:0 18px 44px -14px rgba(0,0,0,.75); position:relative; background:#000; border:1px solid rgba(255,255,255,0.10); }
  .phone-mock canvas{ width:100%; height:100%; display:block; }
  .loading-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:50vh; gap:16px; }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--glass-brd); border-top-color: var(--tint, var(--accent)); animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .loading-txt{ color:var(--text-dim); font-size:14px; }
  .save-overlay{ position:fixed; inset:0; z-index:80; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:flex-start;
    padding: calc(14px + var(--sat)) 16px calc(20px + var(--sab)); }
  .save-overlay.show{ display:flex; }
  .save-head{ width:100%; display:flex; justify-content:flex-start; margin-bottom:12px; }
  .save-close, .save-dl{ background:var(--glass); border:1px solid var(--glass-brd); color:var(--text);
    border-radius:100px; padding:10px 18px; font-size:15px; font-weight:600; min-height:44px; cursor:pointer; }
  .save-overlay img{ max-width:100%; flex:1 1 auto; min-height:0; object-fit:contain; border-radius:10px;
    -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto; }
  .save-overlay p{ color:var(--text-dim); font-size:14px; text-align:center; margin:14px 0 10px; }
  .save-share{ width:100%; max-width:420px; border:none; border-radius:100px; padding:16px;
    font-size:16px; font-weight:700; background:var(--tint,var(--accent)); color:#0c0c0c;
    min-height:52px; cursor:pointer; }
  .save-overlay b{ color:var(--text); }

  .toast{ position:fixed; bottom:calc(env(safe-area-inset-bottom) + 24px); left:50%; transform:translateX(-50%) translateY(20px); background:#1c1c1e; border:1px solid var(--glass-brd); padding:12px 20px; border-radius:100px; font-size:13px; font-weight:600; opacity:0; transition: all .35s var(--spring); z-index:50; pointer-events:none; white-space:nowrap;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="rootContent">
  <div class="navbar">
    <div class="navbar-row">
      <div class="home-wordmark">
        <span>VIRTUAL</span>
        <img class="wm-star" alt="">
        <span>FRAMES</span>
      </div>
    </div>
  </div>
  <div class="home" id="homeScreen">
    <h1 class="large-title">Cornici</h1>
    <p class="home-sub">Scegli l'avventura giocata.</p>
    <div class="list" id="advGrid"></div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="sheet-header">
    <button class="sheet-navbtn" id="sheetNavBtn"></button>
    <div class="sheet-title" id="sheetTitle">Statistiche</div>
    <div class="navbtn-spacer"></div>
  </div>

  <div class="sheet-stage">
    <div class="sheet-track" id="sheetTrack">

      <!-- PAGE 0: stats -->
      <div class="sheet-page" id="pgStats" style="display:flex; flex-direction:column; justify-content:center;">
        <h2 class="page-title">Com'è andata?</h2>

        <div class="field-wrap">
          <label class="field-label" for="teamInput">Nome squadra</label>
          <input id="teamInput" class="field" type="text" maxlength="22" placeholder="Es. I Detective"
                 autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
        </div>

        <div class="solved-wrap" id="solvedWrap">
          <div class="solved-label">Esito dell'indagine</div>
          <div class="solved-opts">
            <button class="solved-btn yes on" data-solved="1">RISOLTO</button>
            <button class="solved-btn no"     data-solved="0">FAILED</button>
          </div>
        </div>

        <div class="pct-wrap">
          <div class="pct-ring" id="pctRing">
            <svg class="ring-svg" viewBox="0 0 240 240">
              <circle cx="120" cy="120" r="100" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="22"
                      stroke-linecap="round" stroke-dasharray="471 158"/>
              <circle id="pctArc" cx="120" cy="120" r="100" fill="none" stroke-width="22" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628"/>
              <g id="pctKnob" class="pct-knob">
                <circle class="pct-knob-outer" cx="220" cy="120" r="19" fill="#ffffff"/>
                <circle id="pctKnobDot" cx="220" cy="120" r="6"/>
              </g>
            </svg>
            <div class="pct-num" id="pctNum"><div class="n">0%</div><div class="l">completata</div></div>
          </div>
        </div>

        <div class="card" id="timeCard">
          <div class="card-label">Tempo di gioco</div>
          <div class="wheels">
            <div class="wheel-highlight"></div>
            <div class="wheel-col"><div class="wheel" id="wheelMin"></div></div>
          </div>
          <div class="wheel-unit">minuti di gioco</div>
        </div>
      </div>

      <!-- PAGE 1: photo -->
      <div class="sheet-page" id="pgPhoto" style="display:flex; flex-direction:column; justify-content:center;">
        <h2 class="page-title">Aggiungi la foto</h2>
        <div class="photo-drop" id="photoDrop">
          <svg class="picon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /> <circle cx="12" cy="13" r="3" /></svg>
          <div class="hint">Tocca per scegliere la foto</div>
        </div>
        <input type="file" accept="image/png,image/jpeg,image/heic,image/*" id="fileInput" style="display:none" multiple="false">
      </div>

      <!-- PAGE 2: result -->
      <div class="sheet-page" id="pgResult" style="padding-top:12px; display:flex; flex-direction:column; justify-content:center;">
        <h2 class="page-title" id="resultTitle" style="display:none;"></h2>
        <div id="resultArea">
          <div class="loading-wrap" id="loadingWrap">
            <div class="spinner"></div>
            <div class="loading-txt">Componendo la cornice…</div>
          </div>
          <div class="phone-mock" id="phoneMock" style="display:none;">
            <canvas id="frameCanvas" width="1080" height="1350"></canvas>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="sheet-footer" id="sheetFooter"></div>
</div>

<div class="toast" id="toast"></div>

<div class="save-overlay" id="saveOverlay">
  <div class="save-head">
    <button class="save-close" onclick="closeSaveOverlay()">Chiudi</button>
  </div>
  <img alt="cornice">
  <p>Tieni premuto sull'immagine e scegli <b>Salva immagine</b></p>
  <button class="save-share" id="shareBtn" onclick="shareImage()">Condividi / Salva in Foto</button>

const pctArc = document.getElementById('pctArc');
const pctNum = document.getElementById('pctNum');
const pctRing = document.getElementById('pctRing');
const pctKnob = document.getElementById('pctKnob');
const CIRC  = 2*Math.PI*100;
const SWEEP = 270;                 // degrees of travel, opening at the bottom
const ARC_LEN = CIRC * SWEEP/360;
pctArc.setAttribute('stroke-dasharray', CIRC);

function setPct(p, animate=true){
  state.pct = Math.max(0, Math.min(100, Math.round(p)));
  const f = state.pct/100;
  pctArc.style.transition = animate ? 'stroke-dashoffset .25s var(--spring)' : 'none';
  pctArc.setAttribute('stroke-dashoffset', CIRC - f*ARC_LEN);
  pctKnob.style.transition = animate ? 'transform .25s var(--spring)' : 'none';
  pctKnob.style.transformOrigin = '120px 120px';
  pctKnob.style.transform = `rotate(${f*SWEEP}deg)`;
  pctNum.querySelector('.n').textContent = state.pct + '%';
}

// Returns the position along the gauge, or null inside the bottom gap.
function pctFromEvent(clientX, clientY){
  const rect = pctRing.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let a = Math.atan2(clientY-cy, clientX-cx) * 180/Math.PI;   // 0 = 3 o'clock
  a = (a - 135 + 360 + 360) % 360;                            // 0 = gauge start
  if(a > SWEEP){
    // in the dead zone: snap to whichever end is closer
    return (a - SWEEP) < (360 - a) ? 100 : 0;
  }
  return (a / SWEEP) * 100;
}

let dragging=false;
function dragTo(x,y){
  setPct(pctFromEvent(x,y), false);
}
pctRing.addEventListener('pointerdown', e=>{
  dragging=true; e.preventDefault();
  pctRing.classList.add('grabbing');
  try{ pctRing.setPointerCapture(e.pointerId); }catch(err){}
  dragTo(e.clientX, e.clientY);
});
pctRing.addEventListener('pointermove', e=>{ if(dragging){ e.preventDefault(); dragTo(e.clientX, e.clientY); } });
pctRing.addEventListener('pointerup', ()=>{ dragging=false; pctRing.classList.remove('grabbing'); });
pctRing.addEventListener('pointercancel', ()=>{ dragging=false; pctRing.classList.remove('grabbing'); });
pctRing.addEventListener('touchmove', e=>{ if(dragging) e.preventDefault(); }, {passive:false});

const ITEM_H = 56; // must match .wheel-item height in CSS
let wheelActive = false;      // a finger is on the drum
let pageIsScrolling = false;  // the page itself is moving
let lockedTop = 0;            // drum position to hold while the page moves

function buildWheel(el, max, initial, onChange){
  el.innerHTML = '<div class="wheel-pad"></div>';
  for(let i=0;i<=max;i++){
    const it = document.createElement('div');
    it.className='wheel-item';
    it.textContent = String(i).padStart(2,'0');
    it.addEventListener('click', ()=> el.scrollTo({top: i*ITEM_H, behavior:'smooth'}));
    el.appendChild(it);
  }
  el.insertAdjacentHTML('beforeend','<div class="wheel-pad"></div>');
  el.scrollTop = initial*ITEM_H;
  lockedTop = initial*ITEM_H;
  requestAnimationFrame(()=>{ el.scrollTop = initial*ITEM_H; });
  let t;
  function updateMid(){
    const idx = Math.round(el.scrollTop/ITEM_H);
    const items = el.querySelectorAll('.wheel-item');
    items.forEach((c,i)=>{
      const d = Math.abs(i - idx);
      c.classList.toggle('mid', d===0);
      c.classList.toggle('near', d===1);
    });
  }
  el.addEventListener('scroll', ()=>{
    if(pageIsScrolling){            // ignore movement dragged in by the page
      el.scrollTop = lockedTop;
      return;
    }
    updateMid();
    clearTimeout(t);
    t = setTimeout(()=>{
      const idx = Math.max(0, Math.min(max, Math.round(el.scrollTop/ITEM_H)));
      el.scrollTo({top: idx*ITEM_H, behavior:'smooth'});
      lockedTop = idx*ITEM_H;
      onChange(idx);
    }, 140);
  });

  // while a finger is on the drum, freeze the page underneath it
  const page = el.closest('.sheet-page');
  el.addEventListener('touchstart', ()=>{
    wheelActive = true;
    if(page) page.style.overflowY = 'hidden';
  }, {passive:true});
  const release = ()=>{
    wheelActive = false;
    if(page) page.style.overflowY = '';
    lockedTop = el.scrollTop;
  };
  el.addEventListener('touchend', release);
  el.addEventListener('touchcancel', release);
  updateMid();
}
// the wheel is rebuilt per adventure: each one has its own standard length
const OVERTIME = 15;                      // slack past the standard length
function setupTimeWheel(theme){
  const card = document.getElementById('timeCard');
  if(theme.noTime){                       // Crime Room doesn't report a time
    card.style.display = 'none';
    state.min = theme.dur;
    return;
  }
  card.style.display = '';
  const max = theme.dur + OVERTIME;       // e.g. 60' room -> wheel runs to 75'
  state.min = theme.dur;                  // but it opens on the standard duration
  buildWheel(document.getElementById('wheelMin'), max, theme.dur, v=> state.min = v);
}

/* ---------------------------------------------------------
   CANVAS FRAME GENERATION
--------------------------------------------------------- */
// Instagram feed post: 1080x1350 (4:5) — the tallest ratio the feed
// shows uncropped, so it takes the most space in the timeline.
const CW = 1080, CH = 1350;

const canvas = document.getElementById('frameCanvas');
const ctx = canvas.getContext('2d');

// adds a rounded-rect SUB-path without resetting the current path,
// so it can be combined with another shape for an even-odd clip
function roundRectPath(c,x,y,w,h,r){
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

const PHOTO_ZOOM = 1.05;  // photo sits 5% tighter inside the frame
// Subjects are usually centred-to-high in the shot and the title sits over
// the top of the window, so bias the crop upward: the people move DOWN.
const PHOTO_Y_BIAS = 0.10;

function drawCoverImage(c, img, x, y, w, h){
  const ir = img.width/img.height, dr = w/h;
  let sx,sy,sw,sh;
  if(ir > dr){ sh = img.height; sw = sh*dr; sy=0; sx=(img.width-sw)/2; }
  else { sw = img.width; sh = sw/dr; sx=0; sy=(img.height-sh)/2; }
  // crop a little tighter => the subject reads 5% larger in the frame
  const zw = sw/PHOTO_ZOOM, zh = sh/PHOTO_ZOOM;
  sx += (sw-zw)/2; sy += (sh-zh)/2;
  // move the sampled window up (clamped) => the subject lands lower down
  sy = Math.max(0, Math.min(img.height - zh, sy - zh*PHOTO_Y_BIAS));
  c.drawImage(img, sx, sy, zw, zh, x, y, w, h);
}

/* ---- team name band, drawn just above the stat badges ---- */
function teamName(){ return (state.team||'').trim(); }
function teamBandH(){ return 0; } // layout is fixed now: the photo no longer shrinks

function drawTeamName(c, by, opts){
  const name = teamName();
  if(!name) return;
  const {font, color, rule} = opts;
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.85)'; c.shadowBlur = 18;
  c.textAlign='center';
  c.fillStyle = color;
  c.font = font;
  // shrink to fit long names
  let f = font, size = parseInt(font.match(/(\d+)px/)[1]);
  while(c.measureText(name).width > CW-150 && size > 26){
    size -= 2;
    f = font.replace(/\d+px/, size+'px');
    c.font = f;
  }
  c.fillText(name.toUpperCase(), CW/2, by);
  if(rule){
    const tw = Math.min(c.measureText(name.toUpperCase()).width + 60, CW-120);
    c.strokeStyle = rule; c.lineWidth = 2; c.globalAlpha = .6;
    c.beginPath(); c.moveTo((CW-tw)/2, by+18); c.lineTo((CW+tw)/2, by+18); c.stroke();
    c.globalAlpha = 1;
  }
  c.restore();
}

function fmtTime(){
  return `${String(state.min).padStart(2,'0')}:${String(state.sec).padStart(2,'0')}`;
}

/* ---- shared decorative helpers ---- */
function diagTape(c,x,y,w,h,colA,colB,stripeW=26){
  c.save();
  roundRect(c,x,y,w,h,0); c.clip();
  const total = w+h;
  for(let i=-h; i<total; i+=stripeW*2){
    c.fillStyle = ((i/(stripeW*2))|0)%2===0 ? colA : colB;
    c.save();
    c.translate(x+i,y);
    c.rotate(Math.PI/4);
    c.fillRect(0,0,stripeW*1.6,h*2.4);
    c.restore();
  }
  c.restore();
}
function halftone(c,x,y,w,h,color,gap=22,maxR=6){
  c.save(); roundRect(c,x,y,w,h,0); c.clip();
  c.fillStyle=color;
  for(let yy=y; yy<y+h; yy+=gap){
    for(let xx=x; xx<x+w; xx+=gap){
      const r = maxR * (0.3+0.7*Math.random());
      c.globalAlpha = 0.5+0.5*Math.random();
      c.beginPath(); c.arc(xx+ (Math.random()-0.5)*6, yy+(Math.random()-0.5)*6, r, 0, 7); c.fill();
    }
  }
  c.globalAlpha=1;
  c.restore();
}
function sparkles(c,x,y,w,h,color,count=40){
  c.save();
  for(let i=0;i<count;i++){
    const sx = x+Math.random()*w, sy=y+Math.random()*h, s=4+Math.random()*10;
    c.fillStyle=color; c.globalAlpha=0.35+Math.random()*0.5;
    c.beginPath();
    c.moveTo(sx, sy-s); c.lineTo(sx+s*0.28, sy-s*0.28); c.lineTo(sx+s, sy);
    c.lineTo(sx+s*0.28, sy+s*0.28); c.lineTo(sx, sy+s); c.lineTo(sx-s*0.28, sy+s*0.28);
    c.lineTo(sx-s, sy); c.lineTo(sx-s*0.28, sy-s*0.28); c.closePath(); c.fill();
  }
  c.globalAlpha=1; c.restore();
}
function cardSuits(c,x,y,w,h,color,gap=64){
  const suits = ['♥','♦','♣','♠'];
  c.save(); c.fillStyle=color; c.font = '30px Georgia'; c.textAlign='center'; c.textBaseline='middle';
  let i=0;
  for(let yy=y+gap/2; yy<y+h; yy+=gap){
    for(let xx=x+gap/2; xx<x+w; xx+=gap){
      c.globalAlpha = 0.5;
      c.fillText(suits[i%4], xx, yy);
      i++;
    }
  }
  c.globalAlpha=1; c.restore();
}
function grain(c,x,y,w,h,alpha=0.05){
  c.save(); roundRect(c,x,y,w,h,0); c.clip();
  for(let i=0;i<3500;i++){
    c.fillStyle = Math.random()>0.5 ? '#000':'#fff';
    c.globalAlpha = Math.random()*alpha;
    c.fillRect(x+Math.random()*w, y+Math.random()*h, 1.4, 1.4);
  }
  c.globalAlpha=1; c.restore();
}

const ICON_CACHE = {};
function iconPath(name){
  if(!ICON_CACHE[name]) ICON_CACHE[name] = new Path2D(ICON_D[name]);
  return ICON_CACHE[name];
}
// draw a 256-grid icon centred on (cx,cy) at the given pixel size
function drawIcon(c, name, cx, cy, size, color, alpha){
  const k = size/256;
  c.save();
  if(alpha!=null) c.globalAlpha = alpha;
  c.translate(cx - size/2, cy - size/2);
  c.scale(k,k);
  c.fillStyle = color;
  c.fill(iconPath(name));
  c.restore();
}

/* ---- stat pill: stadium shape, themed icon + big value ----
   time and percentage are identical in size so they read as a pair ---- */
function statPill(c, x, y, w, h, iconName, value, o){
  const r = h/2;
  c.save();

  // optional gore backdrop for the zombie frames
  if(o.splatter){
    c.save();
    for(let i=0;i<9;i++){
      const sx = x + Math.random()*w, sy = y + (Math.random()<0.5 ? -8 : h+8) + (Math.random()-0.5)*30;
      const rr = 8 + Math.random()*26;
      c.fillStyle = o.splatter; c.globalAlpha = 0.25 + Math.random()*0.4;
      c.beginPath();
      for(let a=0;a<11;a++){
        const ang=(Math.PI*2/11)*a, m=rr*(0.5+Math.random()*0.8);
        c.lineTo(sx+Math.cos(ang)*m, sy+Math.sin(ang)*m);
      }
      c.closePath(); c.fill();
      if(Math.random()>0.55) c.fillRect(sx-rr*0.1, sy, rr*0.2, rr*(1+Math.random()*2.2));
    }
    c.restore();
  }

  // pill body
  roundRect(c, x, y, w, h, r);
  c.fillStyle = o.bg; c.fill();
  if(o.inner){ c.save(); c.clip();
    c.fillStyle = o.inner; c.fillRect(x, y, w, h*0.45); c.restore(); }
  c.strokeStyle = o.accent; c.lineWidth = o.lw || 5; c.stroke();

  // icon on the left, inside its own soft disc
  const icx = x + r;
  if(o.iconDisc){
    c.beginPath(); c.arc(icx, y+h/2, r*0.72, 0, 7);
    c.fillStyle = o.iconDisc; c.fill();
  }
  drawIcon(c, iconName, icx, y + h/2, h*0.46, o.iconColor || o.accent);

  // value fills the rest of the pill
  const textCx = x + r*0.96 + (w - r*0.96)/2;
  const maxW = w - r*1.55 - 26;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = o.font;
  let size = parseInt(o.font.match(/(\d+)px/)[1]);
  while(c.measureText(value).width > maxW && size > 30){
    size -= 2; c.font = o.font.replace(/\d+px/, size+'px');
  }
  c.fillStyle = o.valueColor || o.accent;
  c.fillText(value, textCx, y + h/2 + 2);
  c.textBaseline = 'alphabetic';
  c.restore();
}

/* ---- fit a title inside the frame width (guards against font fallback) ---- */
function spacedWidth(c, text, sp){
  if(!sp) return c.measureText(text).width;
  let w = 0;
  for(const ch of text) w += c.measureText(ch).width + sp;
  return w - sp;
}

// draws text with optional letter-spacing, honouring textAlign='center'
function fillSpaced(c, text, cx, y, sp){
  if(!sp){ c.fillText(text, cx, y); return; }
  const total = spacedWidth(c, text, sp);
  const prev = c.textAlign;
  c.textAlign = 'left';
  let x = cx - total/2;
  for(const ch of text){
    c.fillText(ch, x, y);
    x += c.measureText(ch).width + sp;
  }
  c.textAlign = prev;
}

function fitFont(c, text, maxW, fontStr, sp){
  c.font = fontStr;
  let size = parseInt(fontStr.match(/(\d+)px/)[1]);
  while(spacedWidth(c, text, sp) > maxW && size > 30){
    size -= 2;
    c.font = fontStr.replace(/\d+px/, size+'px');
  }
  return c.font;
}

/* ---- small themed emblem sitting above the adventure title ---- */

  c.strokeStyle = ringColor || color; c.lineWidth = 3.2; c.stroke();

/* ---- horror / texture helpers shared by the frames ---- */
function bloodSplatter(c,x,y,w,h,color,count,seedScale){
  // Real spatter is a main pool with an irregular, slightly lobed edge,
  // a directional spray of small satellites, and a few elongated tails.
  c.save(); roundRect(c,x,y,w,h,0); c.clip();
  for(let i=0;i<count;i++){
    const sx=x+Math.random()*w, sy=y+Math.random()*h;
    const r=(3+Math.random()*13)*seedScale;
    const dir=Math.random()*Math.PI*2;              // impact direction
    const a0=0.20+Math.random()*0.45;

    // main pool, lobed rather than round
    c.fillStyle=color; c.globalAlpha=a0;
    c.beginPath();
    const pts=14;
    for(let k=0;k<=pts;k++){
      const ang=(Math.PI*2/pts)*k;
      const lobe=1 + 0.42*Math.sin(ang*3+dir) + 0.22*Math.sin(ang*5+dir*2);
      const rr=r*lobe*(0.82+Math.random()*0.30);
      const px=sx+Math.cos(ang)*rr, py=sy+Math.sin(ang)*rr*0.92;
      k?c.lineTo(px,py):c.moveTo(px,py);
    }
    c.closePath(); c.fill();

    // darker centre, where the pool is deepest
    c.globalAlpha=a0*0.55; c.fillStyle='rgba(0,0,0,0.55)';
    c.beginPath(); c.ellipse(sx,sy,r*0.42,r*0.36,dir,0,7); c.fill();
    c.fillStyle=color;

    // directional satellites
    const sat=4+Math.floor(Math.random()*7);
    for(let k=0;k<sat;k++){
      const spread=(Math.random()-0.5)*1.1;
      const d=r*(1.4+Math.random()*3.4);
      const dx=sx+Math.cos(dir+spread)*d, dy=sy+Math.sin(dir+spread)*d;
      const dr=r*(0.07+Math.random()*0.26);
      c.globalAlpha=a0*(0.45+Math.random()*0.5);
      c.beginPath();
      c.ellipse(dx,dy,dr*(1+Math.random()*0.9),dr,dir+spread,0,7);
      c.fill();
    }

    // the odd elongated tail
    if(Math.random()>0.55){
      const tl=r*(2.0+Math.random()*3.6), tw=r*0.16;
      c.globalAlpha=a0*0.75;
      c.save(); c.translate(sx,sy); c.rotate(dir);
      c.beginPath(); c.moveTo(0,-tw); c.lineTo(tl,-tw*0.35);
      c.lineTo(tl,tw*0.35); c.lineTo(0,tw); c.closePath(); c.fill();
      c.beginPath(); c.arc(tl,0,tw*0.8,0,7); c.fill();
      c.restore();
    }
  }
  c.globalAlpha=1; c.restore();
}

function scratchMarks(c,x,y,w,h,color,sets){

function compassRose(c,cx,cy,r,color){
  c.save(); c.strokeStyle=color; c.fillStyle=color; c.lineWidth=2;
  c.beginPath(); c.arc(cx,cy,r,0,7); c.stroke();
  c.beginPath(); c.arc(cx,cy,r*0.72,0,7); c.stroke();
  for(let k=0;k<8;k++){
    const a=(Math.PI/4)*k, long=k%2===0;
    const rr=long?r:r*0.6, wdt=long?r*0.10:r*0.06;
    c.beginPath();
    c.moveTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);
    c.lineTo(cx+Math.cos(a+Math.PI/2)*wdt, cy+Math.sin(a+Math.PI/2)*wdt);
    c.lineTo(cx+Math.cos(a+Math.PI)*rr*0.16, cy+Math.sin(a+Math.PI)*rr*0.16);
    c.lineTo(cx+Math.cos(a-Math.PI/2)*wdt, cy+Math.sin(a-Math.PI/2)*wdt);
    c.closePath(); c.fill();
  }
  c.restore();
}
function dashedRoute(c,x,y,w,h,color){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.strokeStyle=color; c.lineWidth=5; c.setLineDash([16,16]); c.lineCap='round';
  c.beginPath();
  c.moveTo(x+w*0.08, y+h*0.18);
  c.bezierCurveTo(x+w*0.42,y+h*0.10, x+w*0.20,y+h*0.52, x+w*0.52,y+h*0.60);
  c.bezierCurveTo(x+w*0.84,y+h*0.68, x+w*0.62,y+h*0.90, x+w*0.90,y+h*0.92);
  c.stroke(); c.setLineDash([]);
  // the X that marks the spot
  c.lineWidth=8;
  const ex=x+w*0.90, ey=y+h*0.92, d=20;
  c.beginPath(); c.moveTo(ex-d,ey-d); c.lineTo(ex+d,ey+d);
  c.moveTo(ex+d,ey-d); c.lineTo(ex-d,ey+d); c.stroke();
  c.restore();
}

/* ---- survival-horror and candlelight texture helpers ---- */
function clawMarks(c,x,y,w,h,color,sets){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip(); c.lineCap='round';
  for(let s=0;s<sets;s++){
    const sx=x+Math.random()*w, sy=y+Math.random()*h;
    const ang=-1.1+Math.random()*2.2, len=90+Math.random()*180;
    for(let k=0;k<4;k++){
      const off=(k-1.5)*(13+Math.random()*7);
      const taper=0.6+Math.random()*0.5;
      c.strokeStyle=color; c.globalAlpha=0.30+Math.random()*0.45;
      c.lineWidth=5*taper;
      c.beginPath();
      c.moveTo(sx+Math.cos(ang+1.57)*off, sy+Math.sin(ang+1.57)*off);
      c.quadraticCurveTo(
        sx+Math.cos(ang)*len*0.55+Math.cos(ang+1.57)*off*1.25,
        sy+Math.sin(ang)*len*0.55+Math.sin(ang+1.57)*off*1.25,
        sx+Math.cos(ang)*len+Math.cos(ang+1.57)*off*1.6,
        sy+Math.sin(ang)*len+Math.sin(ang+1.57)*off*1.6);
      c.stroke();
    }
  }
  c.globalAlpha=1; c.restore();
}
function handPrints(c,x,y,w,h,color,count){

    for(let f=0;f<4;f++){                                           // fingers

function floatingCandles(c,x,y,w,h,count){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let i=0;i<count;i++){
    const cx=x+Math.random()*w, cy=y+Math.random()*h;

    g.addColorStop(1,'rgba(255,160,60,0)');
    c.fillStyle=g; c.beginPath(); c.arc(cx,cy,64,0,7); c.fill();
    // candle body
    c.fillStyle='rgba(243,232,205,0.72)';
    c.fillRect(cx-4, cy+4, 8, len);
    // flame
    c.fillStyle='rgba(255,214,130,0.95)';
    c.beginPath(); c.ellipse(cx, cy-4, 4.5, 10, 0, 0, 7); c.fill();
    c.fillStyle='rgba(255,246,214,0.95)';

// Wands are placed inside the visible border bands — dropping them at
// random put most of them under the photo, where they got clipped away.
function wandSpots(){
  const spots=[];
  const L=SIDE, R=CW-SIDE, topB=PH_Y, botB=BAN_Y+BAN_H;
  const push=(x,y)=>spots.push([x,y]);
  // left and right columns, spread down the frame
  for(let k=0;k<4;k++){
    const t=0.14+k*0.24;
    push(L*0.30 + Math.random()*L*0.34, topB + (CH-topB-botB*0.1)*t);
    push(R + (CW-R)*0.34 + Math.random()*(CW-R)*0.30, topB + (CH-topB-botB*0.1)*(t+0.10));
  }
  // top corners, clear of the title plate
  push(L*0.55, topB*0.55);
  push(CW-L*0.55, topB*0.5);
  // bottom band, either side of the stats strip
  push(CW*0.16, botB + (CH-botB)*0.40);
  push(CW*0.84, botB + (CH-botB)*0.55);
  return spots;
}

function magicWands(c,x,y,w,h,count){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  const spots=wandSpots();
  for(let i=0;i<Math.min(count,spots.length);i++){
    const cx=spots[i][0], cy=spots[i][1];
    const len=74+Math.random()*46;
    // run them ALONG the band (up in the top half, down in the lower half)
    // so the tip glow and its trail stay inside the visible frame
    const ang=(cy < CH/2 ? -Math.PI/2 : Math.PI/2) + (Math.random()-0.5)*0.8;
    const dx=Math.cos(ang), dy=Math.sin(ang);
    const tx=cx+dx*len, ty=cy+dy*len;                     // tip
    c.save(); c.translate(cx,cy); c.rotate(ang);
    // tapered wand: thicker handle, fine tip
    c.beginPath();
    c.moveTo(0,-4.2); c.lineTo(len,-1.5); c.lineTo(len,1.5); c.lineTo(0,4.2);
    c.closePath();
    const wg=c.createLinearGradient(0,0,len,0);
    wg.addColorStop(0,'rgba(58,32,16,0.95)');
    wg.addColorStop(0.55,'rgba(104,64,30,0.92)');
    wg.addColorStop(1,'rgba(214,168,96,0.95)');
    c.fillStyle=wg; c.fill();
    // grip binding
    c.fillStyle='rgba(232,180,92,0.75)';
    c.fillRect(len*0.14,-4.4,5,8.8); c.fillRect(len*0.22,-4.2,3.5,8.4);
    c.restore();
    // glow at the tip
    const g=c.createRadialGradient(tx,ty,1,tx,ty,46);
    g.addColorStop(0,'rgba(255,238,190,0.75)');
    g.addColorStop(0.35,'rgba(255,200,110,0.30)');
    g.addColorStop(1,'rgba(255,190,90,0)');
    c.fillStyle=g; c.beginPath(); c.arc(tx,ty,46,0,7); c.fill();
    // spell trail streaming off the tip
    let px=tx, py=ty, a2=ang;
    for(let k=0;k<16;k++){
      a2 += (Math.random()-0.5)*0.85;
      px += Math.cos(a2)*(7+Math.random()*10);
      py += Math.sin(a2)*(7+Math.random()*10);
      const rr=2.6-k*0.13;
      if(rr<=0.3) break;
      c.fillStyle= k%3===0 ? 'rgba(255,246,214,0.9)' : 'rgba(232,180,92,0.75)';
      c.globalAlpha=Math.max(0, 0.85-k*0.05);
      c.beginPath(); c.arc(px,py,rr,0,7); c.fill();
    }
    c.globalAlpha=1;
    // a small star burst right at the tip
    c.fillStyle='rgba(255,246,214,0.95)';
    c.beginPath();
    for(let k=0;k<8;k++){
      const aa=(Math.PI/4)*k, rr=k%2? 3.4:11;
      const sx2=tx+Math.cos(aa)*rr, sy2=ty+Math.sin(aa)*rr;
      k?c.lineTo(sx2,sy2):c.moveTo(sx2,sy2);
    }
    c.closePath(); c.fill();
  }
  c.restore();
}

function runeCircles(c,x,y,w,h,count){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let i=0;i<count;i++){
    const cx=x+Math.random()*w, cy=y+Math.random()*h, r=26+Math.random()*44;
    c.strokeStyle='rgba(232,180,92,0.30)'; c.lineWidth=1.6;
    c.beginPath(); c.arc(cx,cy,r,0,7); c.stroke();
    c.beginPath(); c.arc(cx,cy,r*0.72,0,7); c.stroke();
    // tick marks around the ring, like an incantation circle
    const n=10+Math.floor(Math.random()*6);
    for(let k=0;k<n;k++){
      const a=(Math.PI*2/n)*k;
      c.beginPath();
      c.moveTo(cx+Math.cos(a)*r*0.74, cy+Math.sin(a)*r*0.74);
      c.lineTo(cx+Math.cos(a)*r*0.98, cy+Math.sin(a)*r*0.98);
      c.stroke();
    }
  }
  c.restore();
}

function emberGlow(c,x,y,w,h,count){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let i=0;i<count;i++){
    const cx=x+Math.random()*w, cy=y+Math.random()*h, r=1+Math.random()*3;
    c.fillStyle= Math.random()>0.5 ? 'rgba(255,186,92,0.85)' : 'rgba(255,128,42,0.75)';
    c.globalAlpha=0.35+Math.random()*0.6;
    c.beginPath(); c.arc(cx,cy,r,0,7); c.fill();
  }
  c.globalAlpha=1; c.restore();
}
function emergencyWash(c,color,alpha){
  const g=c.createLinearGradient(0,0,0,CH);
  g.addColorStop(0, `rgba(${color},${alpha})`);
  g.addColorStop(0.45,`rgba(${color},0)`);
  g.addColorStop(1, `rgba(${color},${alpha*0.9})`);
  c.save(); c.fillStyle=g; c.fillRect(0,0,CW,CH); c.restore();
}

/* ---- extra texture helpers for the redesigned themes ---- */
function hexGrid(c,x,y,w,h,color,size){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.strokeStyle=color; c.lineWidth=1.6;
  const dx = size*1.5, dy = size*Math.sqrt(3);
  for(let row=0, yy=y; yy<y+h+dy; row++, yy+=dy/2){
    for(let xx = x + (row%2 ? dx/2 : 0); xx < x+w+dx; xx += dx){
      c.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI/3*i;
        const px=xx+Math.cos(a)*size*0.5, py=yy+Math.sin(a)*size*0.5;
        i?c.lineTo(px,py):c.moveTo(px,py);
      }
      c.closePath(); c.stroke();
    }
  }
  c.restore();
}
function hudTicks(c,color){
  c.save(); c.strokeStyle=color; c.fillStyle=color; c.lineWidth=2.5;
  for(const side of [0,1]){
    const x = side ? CW-36 : 36;
    c.globalAlpha=0.55;
    c.beginPath(); c.moveTo(x, 190); c.lineTo(x, CH-190); c.stroke();
    for(let yy=220; yy<CH-200; yy+=64){
      c.globalAlpha=0.35+Math.random()*0.4;
      const len = (yy/64)%3===0 ? 22 : 12;
      c.beginPath(); c.moveTo(x, yy); c.lineTo(x + (side?-len:len), yy); c.stroke();
    }
  }
  c.globalAlpha=0.6;
  [[60,150],[CW-60,150],[60,CH-150],[CW-60,CH-150]].forEach(([px,py])=>{
    c.beginPath(); c.arc(px,py,7,0,7); c.fill();
  });
  c.globalAlpha=1; c.restore();
}
function stoneBlocks(c,x,y,w,h,color,bw,bh){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.strokeStyle=color; c.lineWidth=2;
  let row=0;
  for(let yy=y; yy<y+h; yy+=bh, row++){
    const off = row%2 ? bw/2 : 0;
    for(let xx=x-bw+off; xx<x+w+bw; xx+=bw){
      c.strokeRect(xx, yy, bw, bh);
    }
  }
  c.restore();
}
function crestPattern(c,x,y,w,h,color,gap){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.strokeStyle=color; c.lineWidth=2.4;
  for(let yy=y+gap/2; yy<y+h; yy+=gap){
    for(let xx=x+gap/2; xx<x+w; xx+=gap){
      // small heraldic shield
      c.beginPath();
      c.moveTo(xx-13,yy-16); c.lineTo(xx+13,yy-16); c.lineTo(xx+13,yy+2);
      c.quadraticCurveTo(xx+12,yy+16,xx,yy+20);
      c.quadraticCurveTo(xx-12,yy+16,xx-13,yy+2);
      c.closePath(); c.stroke();
    }
  }
  c.restore();
}
function bloodMist(c,x,y,w,h,color,count){
  // the fine aerosol that lands around any real impact
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let i=0;i<count;i++){
    const cx=x+Math.random()*w, cy=y+Math.random()*h;
    const r=0.5+Math.random()*1.9;
    c.fillStyle=color; c.globalAlpha=0.12+Math.random()*0.5;
    c.beginPath(); c.ellipse(cx,cy,r*(1+Math.random()*0.7),r,Math.random()*3,0,7); c.fill();
  }
  c.globalAlpha=1; c.restore();
}

function bloodCastOff(c,x,y,w,h,color,arcs){
  // droplets flung along an arc, as if thrown off a swung weapon
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let a=0;a<arcs;a++){
    const cx=x+Math.random()*w, cy=y+Math.random()*h;
    const rad=110+Math.random()*220;
    const a0=Math.random()*6.28, span=0.5+Math.random()*1.1;
    const n=9+Math.floor(Math.random()*10);
    for(let k=0;k<n;k++){
      const t=k/(n-1);
      const ang=a0+span*t;
      const px=cx+Math.cos(ang)*rad, py=cy+Math.sin(ang)*rad;
      const size=(1.6+Math.random()*4.2)*(1-t*0.55);
      c.fillStyle=color; c.globalAlpha=0.30+Math.random()*0.45;
      c.save(); c.translate(px,py); c.rotate(ang+Math.PI/2);
      c.beginPath(); c.ellipse(0,0,size*0.62,size*(1.5+Math.random()),0,0,7); c.fill();
      c.restore();
    }
  }
  c.globalAlpha=1; c.restore();
}

function bloodDrips(c,x,y,w,h,color,count){
  // A run of blood is widest where it left the wound, tapers as it
  // travels, and ends in a small teardrop — not a lollipop.
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let i=0;i<count;i++){
    const sx=x+Math.random()*w, sy=y+Math.random()*h*0.45;
    const len=36+Math.random()*180;
    const wd=3.5+Math.random()*7;
    const drift=(Math.random()-0.5)*16;          // runs are never perfectly straight
    c.fillStyle=color; c.globalAlpha=0.30+Math.random()*0.42;

    c.beginPath();
    c.moveTo(sx-wd*0.5, sy);
    c.bezierCurveTo(sx-wd*0.46, sy+len*0.45,
                    sx+drift-wd*0.20, sy+len*0.75,
                    sx+drift-wd*0.12, sy+len);
    c.lineTo(sx+drift+wd*0.12, sy+len);
    c.bezierCurveTo(sx+drift+wd*0.20, sy+len*0.75,
                    sx+wd*0.46, sy+len*0.45,
                    sx+wd*0.5, sy);
    c.closePath(); c.fill();

    // the bead hanging at the tip
    c.beginPath();
    c.ellipse(sx+drift, sy+len+wd*0.22, wd*0.30, wd*0.42, 0, 0, 7);
    c.fill();

    // slight pooling where it started
    c.globalAlpha *= 0.8;
    c.beginPath(); c.ellipse(sx, sy, wd*0.85, wd*0.55, 0, 0, 7); c.fill();
  }
  c.globalAlpha=1; c.restore();
}

function bulletHoles(c,x,y,w,h,count){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let i=0;i<count;i++){
    const cx=x+Math.random()*w, cy=y+Math.random()*h, r=5+Math.random()*11;
    c.fillStyle='#000'; c.globalAlpha=0.85;
    c.beginPath(); c.arc(cx,cy,r,0,7); c.fill();
    c.strokeStyle='rgba(220,230,240,0.35)'; c.lineWidth=2; c.globalAlpha=0.5;
    c.beginPath(); c.arc(cx,cy,r+3,0,7); c.stroke();
    for(let k=0;k<7;k++){
      const a=Math.random()*7, len=r*(1.4+Math.random()*2.2);
      c.globalAlpha=0.28;
      c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+Math.cos(a)*len, cy+Math.sin(a)*len); c.stroke();
    }
  }
  c.globalAlpha=1; c.restore();
}
function pipes(c,color){
  c.save(); c.strokeStyle=color; c.lineCap='round';
  const runs=[[70,170,70,CH-170],[CW-70,150,CW-70,CH-150],[46,250,46,CH-260]];
  runs.forEach(([x1,y1,x2,y2],i)=>{
    c.lineWidth=i===2?10:18; c.globalAlpha=0.85;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    c.lineWidth=3; c.globalAlpha=0.5; c.strokeStyle='rgba(255,220,180,0.25)';
    c.beginPath(); c.moveTo(x1-4,y1); c.lineTo(x2-4,y2); c.stroke();
    c.strokeStyle=color;
    // flanges
    c.globalAlpha=0.9; c.lineWidth=i===2?16:26;
    for(let yy=y1; yy<y2; yy+=230){
      c.beginPath(); c.moveTo(x1-2,yy); c.lineTo(x1+2,yy); c.stroke();
    }
  });
  c.globalAlpha=1; c.restore();
}
function oilStains(c,x,y,w,h,color,count){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  for(let i=0;i<count;i++){
    const cx=x+Math.random()*w, cy=y+Math.random()*h, r=20+Math.random()*70;
    c.fillStyle=color; c.globalAlpha=0.20+Math.random()*0.3;
    c.beginPath();
    for(let a=0;a<12;a++){
      const ang=(Math.PI*2/12)*a, rr=r*(0.55+Math.random()*0.7);
      c.lineTo(cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr);
    }
    c.closePath(); c.fill();
  }
  c.globalAlpha=1; c.restore();
}

/* =====================================================================
   SHARED FRAME SKELETON — proportions taken from the VirtualGate
   reference poster (measured against a 4:5 canvas):
     side border 11.5% · photo 77% wide · photo top 2% · bottom 77%
     name banner 74–84% · stats bar 84–97% · bottom trim 97–100%
   Every adventure renders through this, so they stay consistent.
   ===================================================================== */
const SIDE   = Math.round(CW*0.135);          // 146 — a touch more frame
const PH_X   = SIDE;
const PH_W   = CW - SIDE*2;                   // 788
const PH_Y   = Math.round(CH*0.032);          // 43
const TOP_BAND = 126;
const SCRIM_TOP_END = 344;
const BAN_Y  = Math.round(CH*0.775);          // 1046 — team-name band
const BAN_H  = Math.round(CH*0.073);          // 99   — wider band
const PH_B   = BAN_Y + BAN_H;                 // photo runs on behind the band
const PH_H   = PH_B - PH_Y;
const BOTTOM_GAP = Math.round(CH*0.017);      // 23 — bar stops short of the edge
const BAR_H  = Math.round(CH*0.126);          // 170 — fits the stacked rows
const BAR_Y  = CH - BOTTOM_GAP - BAR_H;       // 1197 — sits low
const TRIM_Y = BAR_Y + BAR_H;

function photoRect(){ return {x:PH_X, y:PH_Y, w:PH_W, h:PH_H}; }

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`;
}

/* --- 1. background + decorated border ------------------------------- */
function drawBackdrop(c, T){
  if(Array.isArray(T.bg)){
    const g=c.createLinearGradient(0,0,CW,CH);
    g.addColorStop(0,T.bg[0]); g.addColorStop(1,T.bg[1]);
    c.fillStyle=g;
  } else c.fillStyle=T.bg;
  c.fillRect(0,0,CW,CH);
  if(T.borderDecor){
    c.save();
    // decorate only the border ring, never the photo window
    c.beginPath();
    c.rect(0,0,CW,CH);
    roundRectPath(c, PH_X, PH_Y, PH_W, PH_H, T.radius||14);
    c.clip('evenodd');
    T.borderDecor(c);
    c.restore();
  }
}

/* --- 2. the photo --------------------------------------------------- */
function drawPhoto(c, img, T){
  const r = photoRect();
  c.save(); roundRect(c,r.x,r.y,r.w,r.h,T.radius||14); c.clip();
  drawCoverImage(c, img, r.x, r.y, r.w, r.h);
  if(T.photoTint){ c.fillStyle=T.photoTint; c.fillRect(r.x,r.y,r.w,r.h); }
  if(T.photoVignette) vignette(c,r.x,r.y,r.w,r.h,T.photoVignette,0.32,0.76);
  if(T.photoScratch) scratchMarks(c,r.x,r.y,r.w,r.h,T.photoScratch,4);
  if(T.photoGrain) grain(c,r.x,r.y,r.w,r.h,T.photoGrain);
  // scrim so the title stays readable over any photo
  const g=c.createLinearGradient(0,r.y,0,r.y+262);
  g.addColorStop(0, T.scrim||'rgba(0,0,0,0.88)');
  g.addColorStop(0.62, T.scrim||'rgba(0,0,0,0.55)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(r.x,r.y,r.w,272);
  c.restore();
  if(T.photoDecor){
    c.save(); roundRect(c,r.x,r.y,r.w,r.h,T.radius||14); c.clip();
    T.photoDecor(c, r); c.restore();
  }
  c.strokeStyle=T.edge||T.accent; c.lineWidth=T.edgeW||6;
  roundRect(c,r.x,r.y,r.w,r.h,T.radius||14); c.stroke();
  return r;
}

/* --- 3. top badge: emblem + adventure title ------------------------- */
function drawTopBadge(c, T){
  const cx=CW/2, w=Math.round(CW*0.195), h=88;
  // shield / hexagon plate behind the emblem
  c.save();
  c.beginPath();
  c.moveTo(cx-w/2, 0); c.lineTo(cx+w/2, 0);
  c.lineTo(cx+w/2, h*0.60); c.lineTo(cx, h); c.lineTo(cx-w/2, h*0.60);
  c.closePath();
  c.fillStyle=T.badge||'rgba(0,0,0,0.72)'; c.fill();
  c.strokeStyle=T.accent; c.lineWidth=3; c.stroke();
  c.restore();
  drawIcon(c, T.icon, cx, 36, 38, T.badgeIcon||T.accent);

  c.save();
  c.shadowColor='rgba(0,0,0,0.85)'; c.shadowBlur=20;
  c.textAlign='center';
  c.fillStyle=T.titleColor||T.accent;
  const lines = T.title.split('|');
  if(lines.length===1){
    fitFont(c, lines[0], CW-SIDE*2-40, T.titleFont, T.titleSpacing);
    fillSpaced(c, lines[0], cx, 176, T.titleSpacing);
  } else {
    fitFont(c, lines[0], CW-SIDE*2-40, T.titleFont, T.titleSpacing);
    fillSpaced(c, lines[0], cx, 158, T.titleSpacing);
    c.fillStyle=T.titleColor2||T.titleColor||T.accent;
    fitFont(c, lines[1], CW-SIDE*2-40, T.titleFont, T.titleSpacing);
    fillSpaced(c, lines[1], cx, 228, T.titleSpacing);
  }
  c.restore();
}

/* --- 4. angled banner carrying the team name ------------------------ */
function drawNameBanner(c, T){
  // (themes can stain the banner via T.bannerDecor)
  const name = teamName();
  if(!name) return;
  const notch = 46, inset = Math.round(CW*0.055);
  c.save();
  c.beginPath();
  c.moveTo(inset, BAN_Y + notch);
  c.lineTo(inset + notch, BAN_Y);
  c.lineTo(CW - inset - notch, BAN_Y);
  c.lineTo(CW - inset, BAN_Y + notch);
  c.lineTo(CW - inset, BAN_Y + BAN_H);
  c.lineTo(inset, BAN_Y + BAN_H);
  c.closePath();
  c.fillStyle = T.banner || 'rgba(10,14,26,0.94)'; c.fill();
  if(T.bannerDecor){
    c.save(); c.clip(); T.bannerDecor(c); c.restore();
  }
  c.strokeStyle = T.accent; c.lineWidth = 2.5; c.stroke();
  c.restore();

  c.save();
  c.textAlign='center';
  c.fillStyle = T.bannerInk || '#fff';
  let f = T.nameFont || '400 62px Anton';
  fitFont(c, name.toUpperCase(), CW - inset*2 - 90, f);
  c.fillText(name.toUpperCase(), CW/2, BAN_Y + BAN_H*0.74);
  c.restore();
}

/* --- rubber stamp: drawn offscreen so the ink can be eaten away ---- */
function drawStamp(c, cx, cy, text, color, maxW){
  const W = 620, H = 230, pad = 16;
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const o = off.getContext('2d');

  o.strokeStyle = color; o.fillStyle = color;
  o.lineWidth = 11;
  roundRect(o, pad, pad, W-pad*2, H-pad*2, 16); o.stroke();
  o.lineWidth = 4;
  roundRect(o, pad+18, pad+18, W-(pad+18)*2, H-(pad+18)*2, 10); o.stroke();

  // the word itself
  o.textAlign = 'center'; o.textBaseline = 'middle';
  let size = 86;
  o.font = `400 ${size}px Anton`;
  while(o.measureText(text).width > W - 120 && size > 34){
    size -= 3; o.font = `400 ${size}px Anton`;
  }
  // letter-spaced, the way a stamp plate reads
  const sp = 5, chars = [...text];
  let total = -sp;
  chars.forEach(ch => total += o.measureText(ch).width + sp);
  let x = W/2 - total/2;
  chars.forEach(ch => { o.fillText(ch, x + o.measureText(ch).width/2, H/2); x += o.measureText(ch).width + sp; });

  // small ticks top and bottom, like a date stamp
  o.lineWidth = 3;
  for(let i=0;i<9;i++){
    const tx = W*0.22 + (W*0.56)*(i/8);
    o.beginPath(); o.moveTo(tx, pad+30); o.lineTo(tx, pad+38); o.stroke();
    o.beginPath(); o.moveTo(tx, H-pad-38); o.lineTo(tx, H-pad-30); o.stroke();
  }

  // distress: chew holes out of the ink so it looks pressed, not printed
  o.globalCompositeOperation = 'destination-out';
  for(let i=0;i<900;i++){
    const rx = Math.random()*W, ry = Math.random()*H;
    o.globalAlpha = 0.25 + Math.random()*0.65;
    o.beginPath(); o.arc(rx, ry, 0.8+Math.random()*3.6, 0, 7); o.fill();
  }
  for(let i=0;i<26;i++){                 // larger gaps where the pad ran dry
    const rx = Math.random()*W, ry = Math.random()*H;
    o.globalAlpha = 0.5 + Math.random()*0.5;
    o.beginPath(); o.ellipse(rx, ry, 6+Math.random()*22, 3+Math.random()*10, Math.random()*3, 0, 7); o.fill();
  }
  o.globalAlpha = 1; o.globalCompositeOperation = 'source-over';

  // place it on the frame, tilted like a hand press
  const scale = Math.min((maxW||W)/W, 1);
  c.save();
  c.translate(cx, cy);
  c.rotate(-0.10);
  c.globalAlpha = 0.92;
  c.drawImage(off, -W*scale/2, -H*scale/2, W*scale, H*scale);
  c.restore();
}

/* --- 5. stats bar: logo left · date over time centred · % right ----
   Rooms that don't report a play time just show the date. ---------- */
function drawStatsBar(c, T){
  c.save();
  c.fillStyle = T.bar;
  c.fillRect(0, BAR_Y, CW, BAR_H);
  if(T.barDecor){ c.save(); c.beginPath(); c.rect(0,BAR_Y,CW,BAR_H); c.clip(); T.barDecor(c); c.restore(); }
  c.fillStyle = T.accent; c.globalAlpha=0.9; c.fillRect(0, BAR_Y, CW, 3); c.globalAlpha=1;
  c.restore();

  const ink = T.barInk;
  const pad = Math.round(CW*0.045);
  const cy  = BAR_Y + BAR_H/2;
  const showTime = T.showTime !== false;

  // date above, time below, each with its own icon
  const ics = 34, gap = 13, tx = pad + ics + gap;
  c.save();
  c.textAlign='left'; c.fillStyle=ink; c.font = T.barFont;
  if(showTime){
    const y1 = cy - 6, y2 = cy + BAR_H*0.30;
    drawIcon(c, 'calendar', pad + ics/2, y1 - ics*0.34, ics, T.barIcon || T.accent);
    c.fillText(todayStr(), tx, y1);
    drawIcon(c, T.timeIcon || 'clock', pad + ics/2, y2 - ics*0.34, ics, T.barIcon || T.accent);
    c.fillText(state.min + "'", tx, y2);
  } else {
    const y1 = cy + 14;
    drawIcon(c, 'calendar', pad + ics/2, y1 - ics*0.34, ics, T.barIcon || T.accent);
    c.fillText(todayStr(), tx, y1);
  }
  c.restore();

  // VRG wordmark, right, centred in the bar
  if(logoReady){
    const lw = Math.round(CW*0.155);
    const lh = Math.round(lw * logoImg.height / logoImg.width);
    c.drawImage(logoImg, CW - pad - lw, cy - lh/2, lw, lh);
  }

  // centre slot: either the percentage or a solved / unsolved stamp
  if(T.solvedMode){
    drawStamp(c, CW*0.52, cy,
      state.solved ? 'RISOLTO' : 'FAILED',
      state.solved ? '#2FAE52' : '#CE2029', 380);
  } else {
    c.save();
    c.textAlign='center'; c.fillStyle = T.pctColor;
    fitFont(c, state.pct+'%', 280, T.pctFont);
    c.fillText(state.pct+'%', CW*0.52, cy + 22);
    c.restore();
  }

}

/* --- 6. bottom trim ------------------------------------------------ */
function drawTrim(c, T){
  c.save();
  c.fillStyle = T.trim || (Array.isArray(T.bg) ? T.bg[1] : T.bg);
  c.fillRect(0, TRIM_Y, CW, CH - TRIM_Y);
  c.fillRect(0, BAN_Y+BAN_H, CW, BAR_Y-(BAN_Y+BAN_H));
  if(T.trimDecor){ c.save(); c.beginPath(); c.rect(0,TRIM_Y,CW,CH-TRIM_Y); c.clip(); T.trimDecor(c); c.restore(); }
  c.restore();
}

/* --- the single renderer every adventure goes through --------------- */
function renderFrame(c, img, T){
  drawBackdrop(c, T);
  drawPhoto(c, img, T);
  drawTopBadge(c, T);
  drawNameBanner(c, T);
  drawStatsBar(c, T);
  drawTrim(c, T);
}

async function generateFrame(){
  const loadingWrap = document.getElementById('loadingWrap');
  const phoneMock = document.getElementById('phoneMock');
  loadingWrap.style.display='flex'; phoneMock.style.display='none';
  document.getElementById('resultTitle').textContent = state.adventure.name;

  try{
    await Promise.all(state.adventure.fontLoad.map(f=> document.fonts.load(f)));
  }catch(e){}
  if(!badgeReady){
    await new Promise(res=>{
      if(badgeImg.complete && badgeImg.naturalWidth){ badgeReady=true; return res(); }
      badgeImg.onload = ()=>{ badgeReady=true; res(); };
      badgeImg.onerror = ()=> res();
      setTimeout(res, 1500);
    });
  }
  if(!logoReady){                       // never render the frame logo-less
    await new Promise(res=>{
      if(logoImg.complete && logoImg.naturalWidth){ logoReady=true; return res(); }
      logoImg.onload = ()=>{ logoReady=true; res(); };
      logoImg.onerror = ()=> res();
      setTimeout(res, 1500);
    });
  }
  await new Promise(r=>setTimeout(r, 250));

  ctx.clearRect(0,0,CW,CH);
  DRAWERS[state.adventure.id](ctx, state.photo);

  loadingWrap.style.display='none'; phoneMock.style.display='block';
  prepareFile();
}

/* ---------------------------------------------------------
   SAVING
   iOS will only write to Photos in two ways: the system share
   sheet, or a long-press "Salva immagine" on a visible <img>.
   The long-press route does NOT work on blob: URLs — it needs a
   data: URL — and a share call fails silently if the tap's user
   activation has already been spent. So the button now always
   opens a save sheet with the image as a data: URL, and the
   share is fired synchronously from a tap inside it.
--------------------------------------------------------- */
let readyFile = null;   // File for the share sheet
let readyData = null;   // data: URL for long-press saving

function prepareFile(){
  readyFile = null;
  readyData = null;
  try{ readyData = canvas.toDataURL('image/png'); }catch(e){}
  canvas.toBlob(b=>{
    if(!b) return;
    try{ readyFile = new File([b], `virtualgate-${state.adventure.id}.png`, {type:'image/png'}); }
    catch(e){ readyFile = null; }
  }, 'image/png');
}

function canShareFile(){
  return !!(readyFile && navigator.canShare && navigator.canShare({files:[readyFile]}));
}

// always shows something: no more silent no-op
function saveImage(){
  const ov = document.getElementById('saveOverlay');
  ov.querySelector('img').src = readyData || canvas.toDataURL('image/png');
  ov.querySelector('#shareBtn').style.display = canShareFile() ? 'block' : 'none';
  ov.classList.add('show');
}

function closeSaveOverlay(){
  document.getElementById('saveOverlay').classList.remove('show');
}

// fired straight from a tap, so the activation is still valid
function shareImage(){
  if(!canShareFile()){ toast('Condivisione non disponibile'); return; }
  navigator.share({files:[readyFile]}).catch(err=>{
    if(err && err.name === 'AbortError') return;
    toast('Usa: tieni premuto sull\'immagine');
  });
}

function downloadImage(){
  const a = document.createElement('a');
  a.download = `virtualgate-${state.adventure.id}.png`;
  a.href = readyData || canvas.toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();
  toast('Immagine scaricata');
}
